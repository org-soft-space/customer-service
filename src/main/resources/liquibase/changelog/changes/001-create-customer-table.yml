databaseChangeLog:
  - changeSet:
      id: 001-create-customer-table
      author: customer-service
      changes:
        - createTable:
            tableName: customer
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_customer
                    nullable: false

              - column:
                  name: guid
                  type: UUID
                  constraints:
                    unique: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: surname
                  type: VARCHAR(100)

              - column:
                  name: middle_name
                  type: VARCHAR(100)

              - column:
                  name: email
                  type: VARCHAR(255)

              - column:
                  name: phone
                  type: VARCHAR(20)

              - column:
                  name: customer_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: user_profile_guid
                  type: UUID

              - column:
                  name: responsible_manager_guid
                  type: UUID

              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE customer
              ADD CONSTRAINT chk_customer_type
              CHECK (customer_type IN ('LEAD', 'CUSTOMER'));
        - sql:
            sql: >
              ALTER TABLE customer
              ADD CONSTRAINT chk_customer_contact
              CHECK (
                NULLIF(BTRIM(email), '') IS NOT NULL
                OR
                NULLIF(BTRIM(phone), '') IS NOT NULL
              );
